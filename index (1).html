<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeRent — Rental Properties</title>

  <style>
    :root{
      --bg:#f5f7fb;
      --surface:#ffffff;
      --text:#12213a;
      --muted:#6b7688;
      --line:#dfe5ee;
      --primary:#173f6b;
      --primary-2:#2f78b7;
      --soft:#edf4fa;
      --success:#237a57;
      --danger:#b45353;
      --shadow:0 12px 30px rgba(28,47,74,.10);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{color:inherit;text-decoration:none}
    button,select{font:inherit}

    .topbar{
      height:72px;
      padding:0 6vw;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(255,255,255,.94);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(10px);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:22px;
      font-weight:800;
      letter-spacing:-.4px;
    }

    .brand-mark{
      width:38px;
      height:38px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      display:grid;
      place-items:center;
      color:white;
      font-size:20px;
    }

    nav{
      display:flex;
      align-items:center;
      gap:28px;
      font-size:14px;
      color:#445067;
    }

    nav a.active{
      color:var(--text);
      font-weight:700;
    }

    .contact-btn{
      border:0;
      border-radius:12px;
      background:var(--primary);
      color:white;
      padding:11px 16px;
      cursor:pointer;
    }

    .hero{
      margin:28px 6vw 0;
      min-height:330px;
      border-radius:26px;
      overflow:hidden;
      position:relative;
      box-shadow:var(--shadow);
      background:
        linear-gradient(90deg,rgba(245,248,252,.98) 0%, rgba(245,248,252,.90) 40%, rgba(245,248,252,.15) 70%),
        url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1800&q=85") center/cover;
    }

    .hero-content{
      width:min(620px,90%);
      padding:58px 52px 38px;
    }

    .eyebrow{
      display:inline-block;
      padding:7px 11px;
      border-radius:999px;
      background:white;
      border:1px solid rgba(23,63,107,.15);
      color:var(--primary);
      font-size:13px;
      font-weight:700;
      margin-bottom:18px;
    }

    h1{
      font-size:clamp(40px,5vw,68px);
      line-height:1.02;
      margin:0 0 16px;
      letter-spacing:-2px;
      max-width:680px;
    }

    .hero p{
      margin:0;
      color:#536176;
      font-size:18px;
      line-height:1.6;
      max-width:500px;
    }

    .filters-wrap{
      margin:-38px 9vw 0;
      position:relative;
      z-index:5;
    }

    .filters{
      background:rgba(255,255,255,.98);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px;
      display:grid;
      grid-template-columns:repeat(5,minmax(140px,1fr));
      gap:12px;
    }

    .filter{
      min-width:0;
    }

    .filter label{
      display:block;
      font-size:12px;
      color:var(--muted);
      font-weight:700;
      margin:0 0 7px 4px;
      text-transform:uppercase;
      letter-spacing:.45px;
    }

    select{
      width:100%;
      min-height:46px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:white;
      color:var(--text);
      outline:none;
      cursor:pointer;
    }

    select:focus{
      border-color:#8eb7d8;
      box-shadow:0 0 0 3px rgba(47,120,183,.10);
    }

    .toolbar{
      margin:30px 6vw 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }

    .toolbar h2{
      margin:0 0 5px;
      font-size:27px;
      letter-spacing:-.5px;
    }

    .toolbar p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    .reset-btn{
      border:1px solid var(--line);
      background:white;
      color:#3d4b60;
      border-radius:12px;
      padding:10px 14px;
      cursor:pointer;
    }

    .grid{
      padding:0 6vw 54px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:22px;
    }

    .card{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:0 7px 22px rgba(29,49,77,.07);
      transition:transform .2s ease,box-shadow .2s ease;
    }

    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 16px 34px rgba(29,49,77,.13);
    }

    .photo-wrap{
      position:relative;
      height:230px;
      overflow:hidden;
      background:#e9edf2;
    }

    .photo-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:transform .3s ease;
    }

    .card:hover .photo-wrap img{
      transform:scale(1.025);
    }

    .badge{
      position:absolute;
      top:14px;
      left:14px;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background:white;
      box-shadow:0 3px 12px rgba(0,0,0,.10);
    }

    .badge.vacant{color:var(--success)}
    .badge.rented{color:var(--danger)}

    .favorite{
      position:absolute;
      top:12px;
      right:12px;
      width:38px;
      height:38px;
      border-radius:50%;
      border:0;
      background:white;
      box-shadow:0 3px 12px rgba(0,0,0,.12);
      cursor:pointer;
      font-size:20px;
    }

    .favorite.active{
      color:#d54b66;
    }

    .card-body{
      padding:18px;
    }

    .title-row{
      display:flex;
      justify-content:space-between;
      gap:15px;
      align-items:flex-start;
    }

    .card h3{
      font-size:18px;
      margin:0;
      line-height:1.35;
    }

    .price{
      font-size:18px;
      font-weight:800;
      white-space:nowrap;
    }

    .price span{
      color:var(--muted);
      font-size:12px;
      font-weight:500;
    }

    .location{
      margin:10px 0 14px;
      color:var(--muted);
      font-size:14px;
    }

    .details{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .chip{
      background:var(--soft);
      border-radius:999px;
      padding:7px 10px;
      color:#43526a;
      font-size:12px;
      font-weight:650;
    }

    .view-btn{
      width:100%;
      min-height:43px;
      border:0;
      border-radius:12px;
      background:var(--primary);
      color:white;
      font-weight:750;
      cursor:pointer;
    }

    .view-btn:hover{
      background:#0f3156;
    }

    .empty{
      display:none;
      margin:20px 6vw 60px;
      background:white;
      border:1px dashed #cbd5e1;
      border-radius:16px;
      padding:42px;
      text-align:center;
      color:var(--muted);
    }

    .modal-backdrop{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(13,24,40,.48);
      z-index:50;
      padding:22px;
      align-items:center;
      justify-content:center;
    }

    .modal{
      width:min(560px,96vw);
      background:white;
      border-radius:20px;
      padding:26px;
      box-shadow:0 26px 60px rgba(0,0,0,.24);
    }

    .modal-top{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:flex-start;
    }

    .close-btn{
      border:0;
      background:#eef2f6;
      width:36px;
      height:36px;
      border-radius:50%;
      cursor:pointer;
      font-size:20px;
    }

    .modal h3{
      margin:0 0 8px;
      font-size:24px;
    }

    .modal p{
      color:var(--muted);
      line-height:1.6;
    }

    @media (max-width:1050px){
      .filters{grid-template-columns:repeat(2,1fr)}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      nav a{display:none}
    }

    @media (max-width:700px){
      .topbar{padding:0 18px}
      .hero{margin:18px 18px 0}
      .hero-content{padding:42px 24px 70px}
      .filters-wrap{margin:-36px 26px 0}
      .filters{grid-template-columns:1fr}
      .toolbar{margin:26px 18px 16px}
      .grid{grid-template-columns:1fr;padding:0 18px 40px}
      .photo-wrap{height:220px}
      .contact-btn{display:none}
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">⌂</div>
    <span>HomeRent</span>
  </div>

  <nav>
    <a href="#" class="active">Rent</a>
    <a href="#">Favorites</a>
    <a href="#">About</a>
    <button class="contact-btn" onclick="alert('Demo contact form')">Contact us</button>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <div class="eyebrow">Curated rental homes</div>
    <h1>Find a place that feels like home.</h1>
    <p>Browse quality rental properties by neighborhood, number of rooms, property class and availability.</p>
  </div>
</section>

<div class="filters-wrap">
  <section class="filters">

    <div class="filter">
      <label for="district">Neighborhood</label>
      <select id="district">
        <option value="all">All neighborhoods</option>
        <option value="Downtown">Downtown</option>
        <option value="Riverside">Riverside</option>
        <option value="Green Park">Green Park</option>
        <option value="Old Town">Old Town</option>
      </select>
    </div>

    <div class="filter">
      <label for="rooms">Rooms</label>
      <select id="rooms">
        <option value="all">Any number</option>
        <option value="1">1 room</option>
        <option value="2">2 rooms</option>
        <option value="3">3 rooms</option>
      </select>
    </div>

    <div class="filter">
      <label for="class">Class</label>
      <select id="class">
        <option value="all">All classes</option>
        <option value="Economy">Economy</option>
        <option value="Business">Business</option>
      </select>
    </div>

    <div class="filter">
      <label for="status">Availability</label>
      <select id="status">
        <option value="all">All statuses</option>
        <option value="Vacant">Vacant</option>
        <option value="Rented">Rented</option>
      </select>
    </div>

    <div class="filter">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="default">Recommended</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
    </div>

  </section>
</div>

<section class="toolbar">
  <div>
    <h2>Available homes</h2>
    <p id="resultCount">0 properties found</p>
  </div>
  <button class="reset-btn" onclick="resetFilters()">Reset filters</button>
</section>

<section id="grid" class="grid"></section>

<div id="empty" class="empty">
  <strong>No properties found.</strong><br>
  Try changing one or more filters.
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-top">
      <div>
        <h3 id="modalTitle"></h3>
        <p id="modalText"></p>
      </div>
      <button class="close-btn" onclick="hideModal()">×</button>
    </div>
  </div>
</div>

<script>
const properties = [
  {
    name:"Modern Downtown Apartment",
    district:"Downtown",
    rooms:2,
    cls:"Business",
    status:"Vacant",
    price:1200,
    size:68,
    floor:"3rd floor",
    image:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1100&q=80"
  },
  {
    name:"Riverside Residence",
    district:"Riverside",
    rooms:2,
    cls:"Business",
    status:"Vacant",
    price:1450,
    size:72,
    floor:"5th floor",
    image:"https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=1100&q=80"
  },
  {
    name:"Green Park Studio",
    district:"Green Park",
    rooms:1,
    cls:"Economy",
    status:"Vacant",
    price:850,
    size:38,
    floor:"2nd floor",
    image:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1100&q=80"
  },
  {
    name:"Old Town Loft",
    district:"Old Town",
    rooms:2,
    cls:"Business",
    status:"Rented",
    price:1600,
    size:75,
    floor:"4th floor",
    image:"https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=1100&q=80"
  },
  {
    name:"Family Home near the Park",
    district:"Green Park",
    rooms:3,
    cls:"Economy",
    status:"Vacant",
    price:1250,
    size:94,
    floor:"1st floor",
    image:"https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1100&q=80"
  },
  {
    name:"City View Apartment",
    district:"Downtown",
    rooms:3,
    cls:"Business",
    status:"Rented",
    price:2150,
    size:108,
    floor:"8th floor",
    image:"https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1100&q=80"
  },
  {
    name:"Cozy Riverside Flat",
    district:"Riverside",
    rooms:1,
    cls:"Economy",
    status:"Vacant",
    price:780,
    size:42,
    floor:"2nd floor",
    image:"https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=1100&q=80"
  },
  {
    name:"Old Town Family Apartment",
    district:"Old Town",
    rooms:3,
    cls:"Economy",
    status:"Vacant",
    price:1350,
    size:96,
    floor:"3rd floor",
    image:"https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1100&q=80"
  }
];

const favorites = new Set();

function render(){
  const district = document.getElementById("district").value;
  const rooms = document.getElementById("rooms").value;
  const cls = document.getElementById("class").value;
  const status = document.getElementById("status").value;
  const sort = document.getElementById("sort").value;

  let filtered = properties.filter(p =>
    (district === "all" || p.district === district) &&
    (rooms === "all" || String(p.rooms) === rooms) &&
    (cls === "all" || p.cls === cls) &&
    (status === "all" || p.status === status)
  );

  if(sort === "low") filtered.sort((a,b)=>a.price-b.price);
  if(sort === "high") filtered.sort((a,b)=>b.price-a.price);

  document.getElementById("resultCount").textContent =
    `${filtered.length} ${filtered.length === 1 ? "property" : "properties"} found`;

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");

  if(!filtered.length){
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";

  grid.innerHTML = filtered.map((p) => {
    const index = properties.indexOf(p);
    return `
      <article class="card">
        <div class="photo-wrap">
          <img src="${p.image}" alt="${p.name}">
          <span class="badge ${p.status.toLowerCase()}">${p.status}</span>
          <button
            class="favorite ${favorites.has(index) ? "active" : ""}"
            onclick="toggleFavorite(${index}, this)"
            aria-label="Add to favorites"
          >${favorites.has(index) ? "♥" : "♡"}</button>
        </div>

        <div class="card-body">
          <div class="title-row">
            <h3>${p.name}</h3>
            <div class="price">$${p.price}<span>/month</span></div>
          </div>

          <div class="location">📍 ${p.district}</div>

          <div class="details">
            <span class="chip">${p.rooms} ${p.rooms === 1 ? "room" : "rooms"}</span>
            <span class="chip">${p.cls}</span>
            <span class="chip">${p.size} m²</span>
            <span class="chip">${p.floor}</span>
          </div>

          <button class="view-btn" onclick="showDetails(${index})">View details</button>
        </div>
      </article>
    `;
  }).join("");
}

function toggleFavorite(index, button){
  if(favorites.has(index)){
    favorites.delete(index);
    button.classList.remove("active");
    button.textContent = "♡";
  } else {
    favorites.add(index);
    button.classList.add("active");
    button.textContent = "♥";
  }
}

function showDetails(index){
  const p = properties[index];
  document.getElementById("modalTitle").textContent = p.name;
  document.getElementById("modalText").innerHTML =
    `<strong>${p.district}</strong><br><br>
     ${p.rooms} ${p.rooms === 1 ? "room" : "rooms"} · ${p.size} m² · ${p.cls} class · ${p.status}<br>
     Monthly rent: <strong>$${p.price}</strong><br><br>
     This is a prototype property card using mock data.`;

  document.getElementById("modalBackdrop").style.display = "flex";
}

function hideModal(){
  document.getElementById("modalBackdrop").style.display = "none";
}

function closeModal(event){
  if(event.target.id === "modalBackdrop") hideModal();
}

function resetFilters(){
  document.getElementById("district").value = "all";
  document.getElementById("rooms").value = "all";
  document.getElementById("class").value = "all";
  document.getElementById("status").value = "all";
  document.getElementById("sort").value = "default";
  render();
}

["district","rooms","class","status","sort"].forEach(id =>
  document.getElementById(id).addEventListener("change", render)
);

render();
</script>

</body>
</html>
