<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeRent</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#15263d}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid #dde3ea;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:10}.brand{font-size:23px;font-weight:800}.nav{display:flex;gap:12px}.nav button,.ghost{border:1px solid #dce3eb;background:#fff;border-radius:10px;padding:9px 13px}.hero{margin:24px 6%;padding:55px 45px;border-radius:24px;background:linear-gradient(120deg,#eaf1f8,#fff);box-shadow:0 12px 30px #1b345018}.hero h1{font-size:48px;max-width:650px;margin:0 0 12px}.hero p{color:#667386;font-size:18px}.filters{margin:-10px 8% 28px;background:#fff;border:1px solid #dce3eb;border-radius:17px;padding:15px;display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:10px;box-shadow:0 10px 28px #1b345018}.filters input,.filters select{width:100%;height:45px;border:1px solid #dce3eb;border-radius:10px;padding:0 11px;background:#fff}.toolbar{margin:0 6% 18px;display:flex;justify-content:space-between;align-items:center}.toolbar h2{margin:0}.grid{padding:0 6% 50px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #dce3eb;border-radius:17px;overflow:hidden;box-shadow:0 7px 20px #1b345012}.photo{height:210px;position:relative;background:linear-gradient(135deg,#c9d8e6,#edf3f8);display:grid;place-items:center;font-size:60px}.badge{position:absolute;top:12px;left:12px;background:#fff;border-radius:99px;padding:7px 9px;font-size:11px;font-weight:bold}.heart{position:absolute;top:10px;right:10px;border:0;border-radius:50%;width:39px;height:39px;background:#fff;font-size:20px}.on{color:#cf4862}.body{padding:17px}.row{display:flex;justify-content:space-between;gap:10px}.body h3{margin:0;font-size:18px}.price{font-weight:800;white-space:nowrap}.loc{color:#6c7889;font-size:13px;margin:9px 0 13px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#edf4f9;padding:6px 9px;border-radius:99px;font-size:11px}.actions{display:flex;gap:8px;margin-top:15px}.primary{flex:1;border:0;border-radius:10px;background:#173f6b;color:#fff;padding:10px;font-weight:bold}.compare{border:1px solid #dce3eb;background:#fff;border-radius:10px;padding:10px}.selected{background:#e7f2fb}.map{display:none;margin:0 6% 50px;height:520px;border-radius:20px;background:linear-gradient(25deg,#e5ecdf,#f4f0e6);border:1px solid #dce3eb;position:relative;overflow:hidden}.river{position:absolute;left:60%;width:130px;height:120%;top:-10%;background:#cce6f1;transform:rotate(12deg)}.road{position:absolute;top:48%;left:-10%;width:120%;height:42px;background:#fff;transform:rotate(-10deg)}.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:99px;background:#173f6b;color:#fff;padding:7px 9px;font-weight:bold}.modalbg{display:none;position:fixed;inset:0;background:#071424aa;z-index:30;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;width:min(850px,96vw);max-height:92vh;overflow:auto;border-radius:20px;padding:24px}.close{float:right;border:0;border-radius:50%;width:36px;height:36px}.detail{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.box{background:#eef4f8;border-radius:14px;padding:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form input,.form textarea{border:1px solid #dce3eb;border-radius:9px;padding:10px}.form textarea{grid-column:1/-1}.success{display:none;margin-top:10px;background:#e8f6ee;color:#287255;padding:11px;border-radius:9px}.bar{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #dce3eb;border-radius:14px;box-shadow:0 10px 30px #0002;padding:10px;z-index:20;gap:10px;align-items:center}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e1e6eb;text-align:left}.empty{display:none;text-align:center;padding:40px;color:#6c7889}@media(max-width:950px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.hero{margin:15px}.hero h1{font-size:37px}.filters{margin:-5px 20px 25px;grid-template-columns:1fr}.grid{padding:0 18px;grid-template-columns:1fr}.toolbar{margin:0 18px 15px}.detail{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="brand">⌂ HomeRent</div><div class="nav"><button onclick="browse()">Rent</button><button onclick="showFav()">Favorites <b id="fc">0</b></button></div></header>
<section class="hero"><h1>Find a place that feels like home.</h1><p>Search, filter, compare, save favorites and request a viewing.</p></section>
<section class="filters"><input id="q" placeholder="Search address or neighborhood"><select id="area"><option value="all">All neighborhoods</option><option>Downtown</option><option>Riverside</option><option>Green Park</option><option>Old Town</option></select><select id="rooms"><option value="all">Any rooms</option><option value="1">1 room</option><option value="2">2 rooms</option><option value="3">3 rooms</option></select><select id="price"><option value="all">Any price</option><option value="low">Under $1,000</option><option value="mid">$1,000–1,500</option><option value="high">$1,500+</option></select><select id="status"><option value="all">All statuses</option><option>Available now</option><option>Available Oct 1</option><option>Reserved</option><option>Rented</option></select></section>
<section class="toolbar"><div><h2 id="heading">Available homes</h2><small id="count"></small></div><div><button class="ghost" onclick="view('list')">☷ List</button> <button class="ghost" onclick="view('map')">⌖ Map</button> <button class="ghost" onclick="reset()">Reset</button></div></section>
<div id="grid" class="grid"></div><div id="empty" class="empty">No properties match your filters.</div><div id="map" class="map"><div class="river"></div><div class="road"></div><div id="pins"></div></div>
<div id="bar" class="bar"><span id="ct"></span><button class="primary" onclick="openCompare()">Compare</button><button class="ghost" onclick="clearCompare()">Clear</button></div>
<div id="detailbg" class="modalbg"><div class="modal"><button class="close" onclick="closeM('detailbg')">×</button><h2 id="dt"></h2><div id="dc"></div></div></div>
<div id="comparebg" class="modalbg"><div class="modal"><button class="close" onclick="closeM('comparebg')">×</button><h2>Compare properties</h2><div id="cmp"></div></div></div>
<script>
const P=[
["Modern Downtown Apartment","18 King Street","Downtown",2,"Business","Available now",1200,68,1,"3rd floor","🏙️",24,31],
["Riverside Residence","7 River Walk","Riverside",2,"Business","Available Oct 1",1450,72,1,"5th floor","🌊",66,27],
["Green Park Studio","44 Garden Avenue","Green Park",1,"Economy","Available now",850,38,1,"2nd floor","🌿",37,70],
["Old Town Loft","12 Heritage Lane","Old Town",2,"Business","Reserved",1600,75,2,"4th floor","🏛️",78,66],
["Family Home near the Park","9 Maple Road","Green Park",3,"Economy","Available now",1250,94,2,"1st floor","🏡",46,53],
["City View Apartment","101 Central Plaza","Downtown",3,"Business","Rented",2150,108,2,"8th floor","🌆",18,58],
["Cozy Riverside Flat","31 Quay Street","Riverside",1,"Economy","Available now",780,42,1,"2nd floor","🪴",69,45],
["Old Town Family Apartment","6 Market Square","Old Town",3,"Economy","Available Oct 1",1350,96,2,"3rd floor","🏠",85,39]
].map(x=>({name:x[0],address:x[1],area:x[2],rooms:x[3],cls:x[4],status:x[5],price:x[6],size:x[7],baths:x[8],floor:x[9],icon:x[10],x:x[11],y:x[12]}));
let fav=new Set(),comp=new Set(),favOnly=false;
function filt(){
 const qv=document.getElementById("q").value.toLowerCase();
 const av=document.getElementById("area").value;
 const rv=document.getElementById("rooms").value;
 const pv=document.getElementById("price").value;
 const sv=document.getElementById("status").value;
 return P.filter((p,i)=>
   (!favOnly||fav.has(i)) &&
   (av==="all"||p.area===av) &&
   (rv==="all"||String(p.rooms)===rv) &&
   (sv==="all"||p.status===sv) &&
   (!qv||(p.name+" "+p.address+" "+p.area).toLowerCase().includes(qv)) &&
   (pv==="all"||(pv==="low"&&p.price<1000)||(pv==="mid"&&p.price>=1000&&p.price<=1500)||(pv==="high"&&p.price>1500))
 );
}
function render(){let a=filt();count.textContent=a.length+" properties found";grid.innerHTML="";pins.innerHTML="";a.forEach(p=>{let i=P.indexOf(p);grid.innerHTML+=`<article class="card"><div class="photo">${p.icon}<span class="badge">${p.status}</span><button class="heart ${fav.has(i)?"on":""}" onclick="toggleFav(${i})">${fav.has(i)?"♥":"♡"}</button></div><div class="body"><div class="row"><h3>${p.name}</h3><span class="price">$${p.price}/mo</span></div><div class="loc">📍 ${p.address} · ${p.area}</div><div class="chips"><span class="chip">${p.rooms} rooms</span><span class="chip">${p.cls}</span><span class="chip">${p.size} m²</span></div><div class="actions"><button class="primary" onclick="details(${i})">View details</button><button class="compare ${comp.has(i)?"selected":""}" onclick="toggleComp(${i})">${comp.has(i)?"✓":"＋"} Compare</button></div></div></article>`;pins.innerHTML+=`<button class="pin" style="left:${p.x}%;top:${p.y}%" onclick="details(${i})">$${p.price}</button>`});empty.style.display=a.length?"none":"block";fc.textContent=fav.size;bar.style.display=comp.size?"flex":"none";ct.textContent=comp.size+" selected"}
function toggleFav(i){fav.has(i)?fav.delete(i):fav.add(i);render()}function toggleComp(i){if(comp.has(i))comp.delete(i);else if(comp.size<3)comp.add(i);else alert("Select up to 3 properties.");render()}
function details(i){let p=P[i];dt.textContent=p.name;dc.innerHTML=`<div class="detail"><div><div class="photo" style="height:260px">${p.icon}</div><h3>$${p.price} / month</h3><p>📍 ${p.address}, ${p.area}</p><div class="chips"><span class="chip">${p.rooms} rooms</span><span class="chip">${p.baths} baths</span><span class="chip">${p.size} m²</span><span class="chip">${p.floor}</span><span class="chip">${p.cls}</span><span class="chip">${p.status}</span></div><p>This listing uses mock data and demonstrates a realistic rental-property detail experience.</p></div><div class="box"><h3>Request a viewing</h3><div class="form"><input id="nm" placeholder="Name"><input id="em" placeholder="Email"><input id="date" type="date"><input placeholder="Phone"><textarea placeholder="Message"></textarea></div><button class="primary" style="width:100%;margin-top:10px" onclick="send()">Request viewing</button><div id="ok" class="success">✓ Viewing request sent. Prototype only — no data was submitted.</div></div></div>`;detailbg.style.display="flex"}
function send(){if(!nm.value||!em.value||!date.value){alert("Enter name, email and preferred date.");return}ok.style.display="block"}
function openCompare(){if(comp.size<2){alert("Select at least 2 properties.");return}let a=[...comp].map(i=>P[i]);cmp.innerHTML=`<table><tr><th>Feature</th>${a.map(p=>`<th>${p.name}</th>`).join("")}</tr>${[["Price",p=>"$"+p.price],["Area",p=>p.area],["Rooms",p=>p.rooms],["Size",p=>p.size+" m²"],["Class",p=>p.cls],["Availability",p=>p.status]].map(r=>`<tr><td>${r[0]}</td>${a.map(p=>`<td>${r[1](p)}</td>`).join("")}</tr>`).join("")}</table>`;comparebg.style.display="flex"}
function clearCompare(){comp.clear();render()}function closeM(id){document.getElementById(id).style.display="none"}function view(v){grid.style.display=v==="list"?"grid":"none";map.style.display=v==="map"?"block":"none"}function showFav(){favOnly=true;heading.textContent="Saved favorites";render()}function browse(){favOnly=false;heading.textContent="Available homes";render()}function reset(){
 document.getElementById("q").value="";
 document.getElementById("area").value="all";
 document.getElementById("rooms").value="all";
 document.getElementById("price").value="all";
 document.getElementById("status").value="all";
 favOnly=false;
 document.getElementById("heading").textContent="Available homes";
 render();
}
["q","area","rooms","price","status"].forEach(id=>document.getElementById(id).addEventListener(id==="q"?"input":"change",render));render();
</script></body></html>
